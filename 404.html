<!doctype html>
<!-- GitHub Pages 404. Self-contained on purpose: on a deep missing path, relative CSS links would break.
     The home link is computed: on *.github.io it points to /vibe-to-premium/, elsewhere to /. -->
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · Vibe-to-Premium</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23C8462A'/%3E%3Cpath d='M21.5 8.5l1.1 2.6 2.6 1.1-2.6 1.1-1.1 2.6-1.1-2.6-2.6-1.1 2.6-1.1z' fill='%23fff'/%3E%3C/svg%3E">
<style>
  :root{--bg:#FBF8F3;--surface:#fff;--ink:#2A2520;--muted:#6B6258;--border:#E9E1D4;--accent:#C8462A;--accent-hover:#B23C22;--accent-ink:#fff;--focus:#4B57C9}
  @media (prefers-color-scheme:dark){:root{--bg:#1A1714;--surface:#24201B;--ink:#F2ECE3;--muted:#ABA193;--border:#36302A;--accent:#FF8466;--accent-hover:#FF9A80;--accent-ink:#1A1714;--focus:#9AA3FF}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink);font:400 17px/1.6 "Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  main{max-width:30rem;text-align:center}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:40px 28px;box-shadow:0 1px 2px rgb(42 37 32/.05),0 12px 32px -8px rgb(42 37 32/.12)}
  .code{display:inline-block;font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px dashed var(--border);border-radius:999px;padding:4px 12px}
  h1{font-size:clamp(30px,6vw,42px);line-height:1.1;letter-spacing:-.03em;margin:18px 0 10px}
  p{color:var(--muted);margin:0 0 24px}
  a.btn{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 22px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:600;text-decoration:none;transition:background .15s,transform .15s}
  a.btn:hover{background:var(--accent-hover);transform:translateY(-1px)}
  a:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
  .spark{width:56px;height:56px;margin:0 auto;display:block;animation:float 3s ease-in-out infinite}
  @keyframes float{50%{transform:translateY(-6px) rotate(-6deg)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <div class="card">
    <svg class="spark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="var(--accent)"/><path d="M8.5 19.5c2-3.5 3.6-3.5 5 0s3-3.5 5 0" stroke="var(--accent-ink)" stroke-width="2.4" fill="none" stroke-linecap="round" opacity=".7"/><path d="M21.5 8.5l1.1 2.6 2.6 1.1-2.6 1.1-1.1 2.6-1.1-2.6-2.6-1.1 2.6-1.1z" fill="var(--accent-ink)"/></svg>
    <h1>This page didn’t make the cut.</h1>
    <p><span class="code">404</span><br><br>Like a stray button in a vibe-coded app, it’s gone. The good stuff is one click away.</p>
    <a class="btn" id="home" href="/">Back to Vibe-to-Premium →</a>
  </div>
</main>
<script>
  (function(){var h=location.hostname,seg=location.pathname.split('/').filter(Boolean)[0];
  if(/\.github\.io$/.test(h)&&seg&&h.split('.')[0]!==seg){document.getElementById('home').href='/'+seg+'/';}})();
</script>
</body>
</html>
